name: Build safety regression tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate builder safety and Kconfig handling
        run: python3 -m unittest discover -s tests -p "test_build_guards.py" -v
